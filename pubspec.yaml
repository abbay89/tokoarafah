name: tokoarafah_kasir
description: Aplikasi Kasir Toko Arafah untuk Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  mobile_scanner: ^3.5.6
  excel: ^4.0.5
  path_provider: ^2.1.2
