name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: |
          F=/opt/hostedtoolcache/flutter/stable-3.24.0-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy
          sed -i '1i import groovy.xml.XmlParser' ""
          sed -i '2i import groovy.xml.QName' ""
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tokasrafah-apk
          path: build/app/outputs/flutter-apk/app-release.apk